id: O-high-firm
key: O:high
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Openness: curious strength"
    interviewLine: Tell me about a time when being curious clearly helped the outcome.
    cvLine: Brought a curious approach to [context], supporting [result].
    teamLine: I tend to show up as curious in day-to-day work.
watchOuts:
  - can come across as too curious when the situation needs the opposite pole
improve:
  - area: Balancing curious energy
    actions:
      - This week, pick one meeting and decide in advance whether a curious or
        opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my openness style help you, and
        when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a curious style. Name that preference early,
  and ask opposite-pole colleagues what they need to work well with you.
tradeOff: Leaning curious helps in some rooms and costs recovery or coverage in
  others; the trade-off is real.
