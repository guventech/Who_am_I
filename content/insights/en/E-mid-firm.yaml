id: E-mid-firm
key: E:mid
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Extraversion: situational flexibility"
    interviewLine: Tell me about a time when being flexible with social energy
      clearly helped the outcome.
    cvLine: Brought a flexible with social energy approach to [context], supporting
      [result].
    teamLine: I tend to show up as flexible with social energy in day-to-day work.
watchOuts: []
improve:
  - area: Choosing a pole on purpose
    actions:
      - This week, pick one meeting and decide in advance whether a flexible
        with social energy or opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my extraversion style help you, and
        when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a flexible with social energy style. Name that
  preference early, and ask opposite-pole colleagues what they need to work well
  with you.
tradeOff: Leaning flexible with social energy helps in some rooms and costs
  recovery or coverage in others; the trade-off is real.
