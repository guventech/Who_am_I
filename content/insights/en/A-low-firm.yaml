id: A-low-firm
key: A:low
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Agreeableness: direct strength"
    interviewLine: Tell me about a time when being direct clearly helped the outcome.
    cvLine: Brought a direct approach to [context], supporting [result].
    teamLine: I tend to show up as direct in day-to-day work.
watchOuts:
  - can come across as too direct when the situation needs the opposite pole
improve:
  - area: Balancing direct energy
    actions:
      - This week, pick one meeting and decide in advance whether a direct or
        opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my agreeableness style help you,
        and when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a direct style. Name that preference early, and
  ask opposite-pole colleagues what they need to work well with you.
tradeOff: Leaning direct helps in some rooms and costs recovery or coverage in
  others; the trade-off is real.
