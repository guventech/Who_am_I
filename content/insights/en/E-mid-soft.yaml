workWithOthers: You may prefer working in a flexible with social energy way (if
  this fits you). Say what you need early, and invite people at the opposite
  pole to name what helps them.
tradeOff: A flexible with social energy lean can help in some contexts and cost
  energy in others — check which applies today.
