id: combo-E-high-A-high-soft
key: E:high+A:high
variant: soft
reviewStatus: draft
version: 1
strengths:
  - title: Connector (less certain)
    interviewLine: "If this fits: describe a moment that showed bringing people in
      and keeping goodwill."
    cvLine: May combine bringing people in and keeping goodwill to deliver [result].
    teamLine: I may bring a connector style when the work needs it.
watchOuts:
  - can come across as conflict-avoidant when a hard call was needed (if this
    pattern fits you)
improve:
  - area: Warmth with a spine
    actions:
      - This week, if it fits, ask one teammate where your connector style
        landed well.
      - Before your next high-stakes conversation, write one sentence on the
        outcome you want and one on the relationship you want to protect.
      - Block 20 minutes after that conversation to note what you would keep or
        change.
workWithOthers: You thrive when people feel included. Name tensions early so
  harmony does not hide a real disagreement. Check whether this fits before
  leaning on it.
tradeOff: Connection builds trust; over-smoothing can delay needed decisions.
