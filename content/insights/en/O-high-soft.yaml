variant: soft
reviewStatus: draft
version: 1
strengths:
  - title: "Openness: curious strength"
    interviewLine: "If this fits you: tell a story where being curious helped a real outcome."
    cvLine: May bring a curious approach to [context], supporting [result].
    teamLine: I may show up as curious depending on the situation.
watchOuts:
  - can come across as uneven when others expect a steadier openness style (if
    this fits you)
improve:
  - area: Balancing curious energy
    actions:
      - Once this week, notice when a curious response helped — jot one line
        after the meeting.
      - 'Ask a trusted colleague: "When does my openness style help you, and
        when does it get in the way?"'
      - If it fits, try one small opposite-pole behaviour for 15 minutes and
        note what changed.
workWithOthers: You may prefer working in a curious way (if this fits you). Say
  what you need early, and invite people at the opposite pole to name what helps
  them.
tradeOff: A curious lean can help in some contexts and cost energy in others —
  check which applies today.
