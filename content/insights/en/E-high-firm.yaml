id: E-high-firm
key: E:high
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Extraversion: outgoing strength"
    interviewLine: Tell me about a time when being outgoing clearly helped the outcome.
    cvLine: Brought a outgoing approach to [context], supporting [result].
    teamLine: I tend to show up as outgoing in day-to-day work.
watchOuts:
  - can come across as too outgoing when the situation needs the opposite pole
improve:
  - area: Balancing outgoing energy
    actions:
      - This week, pick one meeting and decide in advance whether a outgoing or
        opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my extraversion style help you, and
        when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a outgoing style. Name that preference early,
  and ask opposite-pole colleagues what they need to work well with you.
tradeOff: Leaning outgoing helps in some rooms and costs recovery or coverage in
  others; the trade-off is real.
