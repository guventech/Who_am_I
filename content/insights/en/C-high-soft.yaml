id: C-high-soft
key: C:high
variant: soft
reviewStatus: draft
version: 1
strengths:
  - title: "Conscientiousness: organised strength"
    interviewLine: "If this fits you: tell a story where being organised helped a
      real outcome."
    cvLine: May bring an organised approach to [context], supporting [result].
    teamLine: I may show up as organised depending on the situation.
watchOuts:
  - Others who expect a steady style may find your energy hard to predict. Say
    what you plan to do. (if this fits you)
improve:
  - area: Balancing organised energy
    actions:
      - Once this week, notice when an organised response helped - jot one line
        after the meeting.
      - 'Ask a trusted colleague: "When does my conscientiousness style help
        you, and when does it get in the way?"'
      - If it fits, try one small opposite-pole behaviour for 15 minutes and
        note what changed.
workWithOthers: You may prefer working in an organised way (if this fits you).
  Say what you need early, and invite people at the opposite pole to name what
  helps them.
tradeOff: An organised lean can help in some contexts and cost energy in others
  - check which applies today.
