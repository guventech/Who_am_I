id: A-high-soft
key: A:high
variant: soft
reviewStatus: draft
version: 1
strengths:
  - title: "Agreeableness: accommodating strength"
    interviewLine: "If this fits you: tell a story where being accommodating helped
      a real outcome."
    cvLine: May bring an accommodating approach to [context], supporting [result].
    teamLine: I may show up as accommodating depending on the situation.
watchOuts:
  - Others who expect a steady style may find your energy hard to predict. Say
    what you plan to do. (if this fits you)
improve:
  - area: Balancing accommodating energy
    actions:
      - Once this week, notice when an accommodating response helped - jot one
        line after the meeting.
      - 'Ask a trusted colleague: "When does my agreeableness style help you,
        and when does it get in the way?"'
      - If it fits, try one small opposite-pole behaviour for 15 minutes and
        note what changed.
workWithOthers: You may prefer working in an accommodating way (if this fits
  you). Say what you need early, and invite people at the opposite pole to name
  what helps them.
tradeOff: An accommodating lean can help in some contexts and cost energy in
  others - check which applies today.
