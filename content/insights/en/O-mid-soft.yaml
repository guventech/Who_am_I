improve:
  - area: Choosing a pole on purpose
    actions:
      - Once this week, notice when a open when it helps, grounded when it
        matters response helped — jot one line after the meeting.
      - 'Ask a trusted colleague: "When does my openness style help you, and
        when does it get in the way?"'
      - If it fits, try one small opposite-pole behaviour for 15 minutes and
        note what changed.
workWithOthers: You may prefer working in a open when it helps, grounded when it
  matters way (if this fits you). Say what you need early, and invite people at
  the opposite pole to name what helps them.
tradeOff: A open when it helps, grounded when it matters lean can help in some
  contexts and cost energy in others — check which applies today.
