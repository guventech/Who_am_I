id: ES-high-soft
key: ES:high
variant: soft
reviewStatus: draft
version: 1
strengths:
  - title: "Emotional Stability: calm strength"
    interviewLine: "If this fits you: tell a story where being calm helped a real outcome."
    cvLine: May bring a calm approach to [context], supporting [result].
    teamLine: I may show up as calm depending on the situation.
watchOuts:
  - Others who expect a steady style may find your energy hard to predict. Say
    what you plan to do. (if this fits you)
improve:
  - area: Balancing calm energy
    actions:
      - Once this week, notice when a calm response helped - jot one line after
        the meeting.
      - 'Ask a trusted colleague: "When does my emotional stability style help
        you, and when does it get in the way?"'
      - If it fits, try one small opposite-pole behaviour for 15 minutes and
        note what changed.
workWithOthers: You may prefer working in a calm way (if this fits you). Say
  what you need early, and invite people at the opposite pole to name what helps
  them.
tradeOff: A calm lean can help in some contexts and cost energy in others -
  check which applies today.
