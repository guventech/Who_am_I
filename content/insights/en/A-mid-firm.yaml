id: A-mid-firm
key: A:mid
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Agreeableness: situational flexibility"
    interviewLine: Tell me about a time when being balanced between candour and
      harmony clearly helped the outcome.
    cvLine: Brought a balanced between candour and harmony approach to [context],
      supporting [result].
    teamLine: I tend to show up as balanced between candour and harmony in
      day-to-day work.
watchOuts: []
improve:
  - area: Choosing a pole on purpose
    actions:
      - This week, pick one meeting and decide in advance whether a balanced
        between candour and harmony or opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my agreeableness style help you,
        and when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a balanced between candour and harmony style.
  Name that preference early, and ask opposite-pole colleagues what they need to
  work well with you.
tradeOff: Leaning balanced between candour and harmony helps in some rooms and
  costs recovery or coverage in others; the trade-off is real.
