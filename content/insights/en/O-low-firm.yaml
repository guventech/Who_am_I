id: O-low-firm
key: O:low
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Openness: practical strength"
    interviewLine: Tell me about a time when being practical clearly helped the outcome.
    cvLine: Brought a practical approach to [context], supporting [result].
    teamLine: I tend to show up as practical in day-to-day work.
watchOuts:
  - can come across as too practical when the situation needs the opposite pole
improve:
  - area: Balancing practical energy
    actions:
      - This week, pick one meeting and decide in advance whether a practical or
        opposite-pole move serves the goal.
      - 'Ask a trusted colleague: "When does my openness style help you, and
        when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a practical style. Name that preference early,
  and ask opposite-pole colleagues what they need to work well with you.
tradeOff: Leaning practical helps in some rooms and costs recovery or coverage
  in others; the trade-off is real.
