id: O-mid-firm
key: O:mid
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Openness: situational flexibility"
    interviewLine: Tell me about a time when being open when it helps, grounded when
      it matters clearly helped the outcome.
    cvLine: Brought an open when it helps, grounded when it matters approach to
      [context], supporting [result].
    teamLine: I tend to show up as open when it helps, grounded when it matters in
      day-to-day work.
watchOuts: []
improve:
  - area: Choosing a pole on purpose
    actions:
      - This week, pick one meeting and decide in advance whether an open when
        it helps, grounded when it matters or opposite-pole move serves the
        goal.
      - 'Ask a trusted colleague: "When does my openness style help you, and
        when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer an open when it helps, grounded when it matters
  style. Name that preference early, and ask opposite-pole colleagues what they
  need to work well with you.
tradeOff: Leaning open when it helps, grounded when it matters helps in some
  rooms and costs recovery or coverage in others; the trade-off is real.
