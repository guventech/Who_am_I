id: ES-mid-firm
key: ES:mid
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: "Emotional Stability: situational flexibility"
    interviewLine: Tell me about a time when being responsive without being stuck at
      either pole clearly helped the outcome.
    cvLine: Brought a responsive without being stuck at either pole approach to
      [context], supporting [result].
    teamLine: I tend to show up as responsive without being stuck at either pole in
      day-to-day work.
watchOuts: []
improve:
  - area: Choosing a pole on purpose
    actions:
      - This week, pick one meeting and decide in advance whether a responsive
        without being stuck at either pole or opposite-pole move serves the
        goal.
      - 'Ask a trusted colleague: "When does my emotional stability style help
        you, and when does it get in the way?"'
      - Schedule a 15-minute practice of the opposite pole (quiet focus /
        outreach / structure / openness) midweek.
workWithOthers: You often prefer a responsive without being stuck at either pole
  style. Name that preference early, and ask opposite-pole colleagues what they
  need to work well with you.
tradeOff: Leaning responsive without being stuck at either pole helps in some
  rooms and costs recovery or coverage in others; the trade-off is real.
