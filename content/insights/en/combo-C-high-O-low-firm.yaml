id: combo-C-high-O-low-firm
key: C:high+O:low
variant: firm
reviewStatus: draft
version: 1
strengths:
  - title: Reliable executor
    interviewLine: Describe a moment that showed structure and practical follow-through.
    cvLine: Combined structure and practical follow-through to deliver [result].
    teamLine: I often bring a reliable executor style to group work.
watchOuts:
  - can come across as rigid when a novel approach would have helped
improve:
  - area: Structure that still learns
    actions:
      - This week, ask one teammate where your reliable executor style landed
        well — and where it overshot.
      - Before your next high-stakes conversation, write one sentence on the
        outcome you want and one on the relationship you want to protect.
      - Block 20 minutes after that conversation to note what you would keep or
        change.
workWithOthers: You deliver when plans are clear. Leave one slot in the plan for
  a better idea from someone more exploratory.
tradeOff: Reliability ships work; closed plans can miss a better route.
